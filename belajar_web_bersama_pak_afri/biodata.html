<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata - Faris Maulana</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex-direction: column;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .info-group {
            margin-bottom: 15px;
        }

        .info-group strong {
            color: #2c3e50;
        }

        .section-title {
            font-weight: bold;
            color: #2c3e50;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        ul, ol {
            margin-top: 5px;
            padding-left: 20px;
        }

        li {
            margin-bottom: 5px;
            line-height: 1.5;
        }

        .hobi-list li {
            color: #e67e22;
            font-weight: 500;
        }

        .citacita-list li {
            color: #27ae60;
        }

        .pendidikan-list li {
            color: #2980b9;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }

        .btn-primary {
            background-color: #3498db; /* Warna Biru */
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Biodata Diri</h1>

        <div class="info-group">
            <p><strong>Nama:</strong> Faris Maulana</p>
            <p><strong>Umur:</strong> 16 Tahun</p>
        </div>

        <div class="section-title">Hobi:</div>
        <ul class="hobi-list">
            <li>Coding</li>
        </ul>

        <div class="section-title">Cita-Cita:</div>
        <ul class="citacita-list">
            <li>Founder</li>
            <li>CEO</li>
            <li>Guru</li>
        </ul>

        <div class="section-title">Riwayat Pendidikan:</div>
        <ol class="pendidikan-list">
            <li>Taman Kanak-kanak (TK)</li>
            <li>Sekolah Dasar (SD)</li>
            <li>Sekolah Menengah Pertama (SMP)</li>
            <li>Sekolah Menengah Kejuruan (SMK)</li>
            <li>Kuliah</li>
        </ol>
    </div>

    <!-- kembali -->
     <a href="index.html" class="btn btn-primary" style="margin-top: 5vh;">Kembali</a>

</body>
</html>
