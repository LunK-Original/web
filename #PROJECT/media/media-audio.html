<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Card Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'CircularStd', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .spotify-card {
            background-color: #181818;
            padding: 20px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s ease;
        }

        .spotify-card:hover {
            background-color: #282828;
        }

        .cover-art {
            width: 100%;
            height: 280px;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .song-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-name {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 15px;
        }

        /* Modifikasi Tampilan Elemen Audio Native */
        audio {
            width: 100%;
            height: 40px;
            filter: invert(1) hue-rotate(180deg); /* Menyesuaikan tema gelap */
            border-radius: 20px;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background-color: #3498db;
            border-radius: 6px;
            color: #ffffff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="spotify-card">
        <!-- Gambar Cover Lagu -->
        <img src="https://picsum.photos/300" alt="Cover Album" class="cover-art">

        <!-- Informasi Lagu -->
        <div class="song-title">Judul Lagu Favorit</div>
        <div class="artist-name">Faris Maulana</div>

        <!-- Tag Audio HTML -->
        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
            Browser kamu tidak mendukung pemutar audio.
        </audio>

        <a href="../media.html" class="back-button">Kembali</a>
    </div>

</body>
</html>
