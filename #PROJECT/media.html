<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Web</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 5vh 20px 20px;
            background-color: #25282b;
            color: #ffffff;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo a {
            color: #ffffff;
            font-size: 30px;
            font-weight: bold;
            text-decoration: none;
        }

        .link {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .link a {
            padding: 10px;
            color: #ffffff;
            text-decoration: none;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 0;
        }

        h1 {
            margin: 10vh 0 30px;
            text-align: center;
        }

        .media-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
            gap: 20px;
        }

        .media-card {
            padding: 24px;
            background-color: #3a4771;
            border-radius: 10px;
            text-align: center;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .media-card:hover {
            background-color: #3498db;
            transform: scale(1.05);
        }

        .media-card a {
            display: block;
            padding: 12px;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 20px;
            background-color: #2ecc71;
            border-radius: 6px;
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
        }

        .back-button:hover {
            background-color: #27ae60;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            nav {
                flex-direction: column;
                text-align: center;
            }

            .logo a {
                font-size: 24px;
            }

            .link a {
                padding: 6px;
            }

            h1 {
                margin-top: 40px;
            }

            .media-card:hover {
                transform: none;
            }
        }
    </style>

</head>
<body>
    <nav>
        <div class="logo">
            <a href="index.html">Tugas coding</a>
        </div>
        <div class="link">
            <a href="index.html">Beranda</a>
            <a href="media.html">Media</a>
            <a href="https://github.com">Komunitas</a>
            <a href="web-top-up.html">Kontak</a>
        </div>
    </nav>

    <main>
        <h1>Media Web</h1>

        <div class="media-container">
            <div class="media-card">
                <a href="media/media-img.html">Media foto</a>
            </div>
            <div class="media-card">
                <a href="media/media-video.html">Media video</a>
            </div>
            <div class="media-card">
                <a href="media/media-audio.html">Media audio</a>
            </div>
        </div>

        <a href="index.html" class="back-button">Kembali</a>
    </main>
</body>
</html>
